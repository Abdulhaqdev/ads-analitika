name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to ads.ilimbooks.uz
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            set -euo pipefail
            cd /var/www/ads-analitika
            git config --global --add safe.directory /var/www/ads-analitika || true
            git remote set-url origin https://github.com/Abdulhaqdev/ads-analitika.git
            git fetch --prune origin main
            git checkout -B main origin/main
            git reset --hard origin/main
            chmod +x deploy/deploy.sh
            bash deploy/deploy.sh
