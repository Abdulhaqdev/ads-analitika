name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to ads.ilimbooks.uz
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            set -euo pipefail
            APP_DIR=/var/www/ads-analitika
            cd "$APP_DIR"
            git config --global --add safe.directory "$APP_DIR" || true
            git remote set-url origin https://github.com/Abdulhaqdev/ads-analitika.git
            git fetch --prune origin main
            # Drop conflicting untracked files, keep runtime data
            git clean -fd \
              -e .env \
              -e database/database.sqlite \
              -e vendor \
              -e node_modules \
              -e public/build \
              -e public/storage \
              -e storage
            git checkout -f -B main origin/main
            git reset --hard origin/main
            chmod +x deploy/deploy.sh
            bash deploy/deploy.sh
